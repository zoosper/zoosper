name: Documentation website

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/docs-site.yml'
      - 'README.md'
      - 'docs/**'
      - 'docs-site/**'
      - 'app/zoosper-core/tests/Unit/Documentation/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zoosper-documentation-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Zoosper source
        uses: actions/checkout@v4

      - name: Configure PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Build canonical documentation
        run: php docs-site/build.php

      - name: Check out documentation website repository
        uses: actions/checkout@v4
        with:
          repository: zoosper/zoosper-cms-website
          ref: master
          token: ${{ secrets.DOCS_WEBSITE_TOKEN }}
          path: docs-site/publish

      - name: Synchronise generated website
        run: rsync -a --delete --exclude='.git/' docs-site/build/ docs-site/publish/

      - name: Publish generated website
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd docs-site/publish
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'Documentation website is already current.'
            exit 0
          fi
          git commit -m "Publish Zoosper documentation from ${SOURCE_SHA}"
          git push origin HEAD:master
