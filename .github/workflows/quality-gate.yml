name: Quality Gate
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  COMPOSER_NO_INTERACTION: "1"
  COMPOSER_CACHE_DIR: ${{ github.workspace }}/.cache/composer
  DB_CONNECTION: sqlite
  DB_DRIVER: sqlite
  DB_DATABASE: ${{ github.workspace }}/var/ci.sqlite
jobs:
  quality:
    name: PHP 8.5 quality contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zoosper_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          extensions: curl, gd, mbstring, pdo_sqlite, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/composer
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php85-
      - name: Validate Composer metadata
        run: composer validate --no-check-publish --strict
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-ansi
      - name: Verify locked production platform requirements
        run: composer check-platform-reqs --no-dev
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction
      - name: Prepare CI runtime
        run: mkdir -p var && touch var/ci.sqlite
      - name: Validate shipped JavaScript syntax
        run: composer ci:js
      - name: Run final test-signal closure DOM suite
        run: composer test:test-signal-closure-dom
      - name: Run Settings workspace DOM behaviour suite
        run: composer test:settings-workspace-dom
      - name: Run Settings scope selector DOM behaviour suite
        run: composer test:settings-scope-dom
      - name: Run Permission Explorer DOM behaviour suite
        run: composer test:permission-explorer-dom
      - name: Run Dashboard personalisation DOM behaviour suite
        run: composer test:dashboard-dom
      - name: Run Personal Access Token DOM behaviour suite
        run: composer test:pat-dom
      - name: Run Admin shell DOM behaviour suite
        run: composer test:admin-shell-dom
      - name: Run Admin Grid DOM behaviour suite
        run: composer test:admin-grid-dom
      - name: Run Editor insertion behaviour suite
        run: composer test:editor-insertion
      - name: Run Media picker behaviour suite
        run: composer test:media-picker
      - name: Run strict repository gate
        run: composer gate:strict
      - name: Run blocking full-scope Psalm analysis
        run: composer analyse
      - name: Run full Pest suite (SQLite)
        run: composer test
      - name: Run Pest test suite (MySQL)
        env:
          DB_CONNECTION: mysql
          DB_DRIVER: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: zoosper_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: composer test
      - name: Compile module manifest
        run: composer compile
      - name: Migrate CI release database
        env:
          DB_CONNECTION: mysql
          DB_DRIVER: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: zoosper_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: composer migrate
      - name: Apply declared foreign keys
        env:
          DB_CONNECTION: mysql
          DB_DRIVER: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: zoosper_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php8.5 bin/zoosper schema:foreign-keys:apply --confirm=apply
      - name: Run alpha release checks
        env:
          DB_CONNECTION: mysql
          DB_DRIVER: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: zoosper_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: composer release:check
      - name: Prove disposable fresh install and critical runtime inventory
        run: composer fresh-install:smoke
